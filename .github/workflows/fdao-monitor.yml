name: FDAO Background Monitor
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    paths: ['.github/workflows/fdao-monitor.yml']
permissions:
  contents: write
concurrency:
  group: fdao-background-monitor
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fdao-dashboard-source
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update live chain index
        run: node fdao-monitor/indexer6.mjs
      - name: Backfill launch-to-date daily history
        continue-on-error: true
        run: node fdao-monitor/history-indexer.mjs
      - name: Persist computed data safely
        run: |
          mkdir -p /tmp/fdao-data
          cp fdao-monitor/data/*.json /tmp/fdao-data/
          git fetch origin fdao-dashboard-source
          git reset --hard origin/fdao-dashboard-source
          mkdir -p fdao-monitor/data
          cp /tmp/fdao-data/*.json fdao-monitor/data/
          git config user.name 'fdao-monitor-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add fdao-monitor/data/
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh FDAO monitor"
            git push origin HEAD:fdao-dashboard-source
          fi
